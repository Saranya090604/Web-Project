<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>radio button and check boxes</title>
</head>
<body>
    <h1>Favourite dishes</h1>
    <!-- check boxes -->
     <form>
        <label for="Masala dose"></label>
        <input type="checkbox" name="dishes" id="masala dose" value="Masala dose" diasable>Masala Dose
        <label for="Set Dose"></label>
        <input type="checkbox" name="dishes" id="Set dose" value="Set dose" checked>Set Dose
        <label for="parotta"></label>
        <input type="checkbox" name="dishes" id="parotta" value="parotta">parotta
     </form>

     <!-- radio button -->
      <h2>Product size</h2>
      <form>
        <label for="small">
        <input type="radio" name="size" id="small">Small
        </label>

        <label for="medium">
        <input type="radio" name="size" id="medium" checked>Medium
        </label>

        <label for="large">
        <input type="radio" name="size" id="large">Large
        </label>

      </form>
</body>
</html>
