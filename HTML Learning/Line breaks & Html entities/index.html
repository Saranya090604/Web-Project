<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Line breaks, HR and entities</title>
</head>
<body>
    <h1>Line breaks, Horizontal rules % html entities</h1>
    <!-- line break -->
    hello <br> I Love <br> Pizza

    <!-- horizontal line -->
    <p>This is first line</p>
    <hr/>     
    <p>This is second line</p>
    <p>This is third line</p>
    <!-- pre tag -->
    <pre>
        Hello          world
             this is so awkward 
    </pre>
    <code>&lt;h1&gt;This is the code&lt;/h1&gt;</code>
</body>
</html>
