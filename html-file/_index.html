<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .flexcontainer {
            display:flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            height: 300px;
        }
        input {
            border: none;
            border-radius: 12px;
            border: 1px solid darkmagenta;
            padding: 10px;
        }
        input:focus {
            background-color: white;
        }
        button {
            border: none;
            border: 1px solid darkmagenta;
            background-color: black;
            border-radius: 12px;
            padding: 10px;
            width: 150px;
            color:bisque;
        }
        button hover {
            background-color: blueviolet;
            color:white;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class = "flexcontainer">
        <div>
            <input id = "uName" type= "text" placeholder="Enter user-mail" />
        </div>
        <div>
            <input id = "uPassword" type = "Password" placeholder="Enter user-password"/>
        </div>
        <div>
            <button id="btn_login">Login</button>
        </div>
    </div>
    <script src = "javascript/formValidation.js"></script>
</body>
</html>
